<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Service Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <header class="header">
        <div class="nav container">
            <a href="dashboard.html" class="nav__logo">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
            <div class="nav__actions">
                <button class="nav__btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="nav__btn" id="languageToggle"><i class="fas fa-language"></i><span id="langText">EN</span></button>
                <button class="nav__btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </header>

    <main style="padding-top: calc(var(--header-height) + 32px); padding-bottom: 64px;">
        <div class="container">
            <div style="max-width: 600px; margin: 0 auto;">
                <div style="text-align: center; margin-bottom: 32px;">
                    <div id="profileAvatar" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #2563EB, #F59E0B); display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(37,99,235,0.3);">U</div>
                    <h2 id="profileName">Loading...</h2>
                    <p style="color: var(--text-secondary);" id="profileEmail"></p>
                </div>

                <div class="card" style="margin-bottom: 20px;">
                    <h3 style="margin-bottom: 20px;"><i class="fas fa-user-edit"></i> Edit Profile</h3>
                    <form onsubmit="handleProfileUpdate(event)">
                        <div class="form-group">
                            <label class="form-group__label">Full Name</label>
                            <input type="text" class="form-group__input" id="editName" required>
                        </div>
                        <div class="form-group">
                            <label class="form-group__label">Email</label>
                            <input type="email" class="form-group__input" id="editEmail" required>
                        </div>
                        <div class="form-group">
                            <label class="form-group__label">Mobile Number</label>
                            <input type="tel" class="form-group__input" id="editMobile" required maxlength="10">
                        </div>
                        <div class="form-group">
                            <label class="form-group__label">Language</label>
                            <select class="form-group__input" id="editLanguage">
                                <option value="en">English</option>
                                <option value="bn">বাংলা</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn--primary btn--block">
                            <i class="fas fa-save"></i> Update Profile
                        </button>
                    </form>
                </div>

                <div class="card">
                    <h3 style="margin-bottom: 20px;"><i class="fas fa-lock"></i> Change Password</h3>
                    <form onsubmit="handlePasswordChange(event)" id="passwordForm">
                        <div class="form-group">
                            <label class="form-group__label">Current Password</label>
                            <input type="password" class="form-group__input" id="currentPassword" required>
                        </div>
                        <div class="form-group">
                            <label class="form-group__label">New Password</label>
                            <input type="password" class="form-group__input" id="newPassword" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-group__label">Confirm Password</label>
                            <input type="password" class="form-group__input" id="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn btn--secondary btn--block">
                            <i class="fas fa-key"></i> Change Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/language.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = 'index.html';
        }

        async function loadProfile() {
            try {
                const response = await API.auth.getProfile();
                if (response.success) {
                    const user = response.data;
                    document.getElementById('profileName').textContent = user.name;
                    document.getElementById('profileEmail').textContent = user.email;
                    document.getElementById('editName').value = user.name || '';
                    document.getElementById('editEmail').value = user.email || '';
                    document.getElementById('editMobile').value = user.mobile || '';
                    document.getElementById('editLanguage').value = user.language || 'en';
                    
                    const avatar = document.getElementById('profileAvatar');
                    if (avatar && user.name) {
                        avatar.textContent = user.name.charAt(0).toUpperCase();
                    }
                }
            } catch (error) {
                showToast('Failed to load profile', 'error');
            }
        }

        async function handleProfileUpdate(event) {
            event.preventDefault();
            
            const data = {
                name: document.getElementById('editName').value,
                email: document.getElementById('editEmail').value,
                mobile: document.getElementById('editMobile').value,
                language: document.getElementById('editLanguage').value
            };
            
            try {
                showLoading();
                const response = await API.auth.updateProfile(data);
                if (response.success) {
                    Auth.saveUser(response.data);
                    showToast('Profile updated!', 'success');
                }
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function handlePasswordChange(event) {
            event.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match', 'warning');
                return;
            }
            
            if (newPassword.length < 6) {
                showToast('Password must be at least 6 characters', 'warning');
                return;
            }
            
            try {
                showLoading();
                await API.auth.changePassword({ currentPassword, newPassword });
                showToast('Password changed!', 'success');
                document.getElementById('passwordForm').reset();
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        loadProfile();
    </script>
</body>
</html>
