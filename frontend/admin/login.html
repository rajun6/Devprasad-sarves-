<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a5f);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .box{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.3)}
        .icon{width:70px;height:70px;background:linear-gradient(135deg,#4f46e5,#6366f1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:30px;color:#fff}
        h2{text-align:center;margin-bottom:5px;font-size:24px;color:#1e293b}
        p{text-align:center;color:#64748b;font-size:13px;margin-bottom:30px}
        input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;font-family:inherit;outline:none;margin-bottom:15px;transition:.2s}
        input:focus{border-color:#4f46e5}
        button{width:100%;padding:14px;background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:.3s;font-family:inherit}
        button:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(79,70,229,.4)}
        .error{background:#fef2f2;color:#dc2626;padding:12px;border-radius:10px;font-size:13px;margin-bottom:15px;display:none}
        a{display:block;text-align:center;margin-top:20px;color:#64748b;text-decoration:none;font-size:13px}
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🛡️</div>
        <h2>Admin Login</h2>
        <p>Service Center Management</p>
        <div class="error" id="error"></div>
        <input type="email" id="email" placeholder="Email" value="admin@servicecenter.com">
        <input type="password" id="password" placeholder="Password" value="admin123456">
        <button onclick="login()">Login to Panel</button>
        <a href="../user/index.html">← Back to Website</a>
    </div>
    <script>
        async function login(){
            var btn=document.querySelector('button'),err=document.getElementById('error');
            btn.textContent='Logging in...';btn.disabled=true;err.style.display='none';
            try{
                var res=await fetch('http://localhost:5000/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
                var data=await res.json();
                if(data.success&&data.user.role==='admin'){localStorage.setItem('sc_token',data.token);localStorage.setItem('sc_user',JSON.stringify(data.user));location.href='index.html'}
                else throw new Error('Invalid');
            }catch(e){err.textContent='Login failed! Check credentials.';err.style.display='block';btn.textContent='Login to Panel';btn.disabled=false}
        }
    </script>
</body>
</html>
