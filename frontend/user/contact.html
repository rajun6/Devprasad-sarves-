<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Service Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-hero{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:60px 20px;text-align:center}
        .contact-hero h1{font-size:36px;margin-bottom:10px}
        .contact-container{max-width:1000px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
        .contact-info h2{font-size:24px;margin-bottom:20px;color:#2563eb}
        .contact-detail{display:flex;align-items:center;gap:15px;padding:20px;background:#fff;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
        .contact-detail i{font-size:28px;color:#2563eb;width:40px}
        .contact-detail h4{font-size:16px;margin-bottom:3px}
        .contact-detail p{color:#64748b;font-size:14px}
        .contact-form{background:#fff;padding:30px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
        .contact-form h2{font-size:24px;margin-bottom:20px;color:#2563eb}
        .contact-form input,.contact-form textarea{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin-bottom:15px;font-family:inherit;font-size:14px;outline:none}
        .contact-form input:focus,.contact-form textarea:focus{border-color:#2563eb}
        .contact-form textarea{resize:vertical;min-height:100px}
        .contact-form button{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
        @media(max-width:768px){.contact-container{grid-template-columns:1fr}}
    </style>
</head>
<body>

<header class="header">
    <div class="nav">
        <a href="index.html" class="logo">🏢 Service Center</a>
        <div class="nav-actions">
            <a href="index.html" class="btn btn-outline">← Back</a>
        </div>
    </div>
</header>

<section class="contact-hero">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you</p>
</section>

<div class="contact-container">
    <div class="contact-info">
        <h2>Get In Touch</h2>
        <div class="contact-detail">
            <i class="fab fa-whatsapp"></i>
            <div><h4>WhatsApp</h4><p id="cPhone">+91 8972550281</p></div>
        </div>
        <div class="contact-detail">
            <i class="fas fa-envelope"></i>
            <div><h4>Email</h4><p id="cEmail">-</p></div>
        </div>
        <div class="contact-detail">
            <i class="fas fa-map-marker-alt"></i>
            <div><h4>Address</h4><p id="cAddress">-</p></div>
        </div>
        <div class="contact-detail">
            <i class="fas fa-clock"></i>
            <div><h4>Working Hours</h4><p id="cHours">Mon-Sat: 9AM-6PM</p></div>
        </div>
    </div>
    
    <div class="contact-form">
        <h2>Send Message</h2>
        <form onsubmit="sendMessage(event)">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Mobile Number">
            <textarea placeholder="Your Message..." required></textarea>
            <button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button>
        </form>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2026 Online Service Center</p>
</footer>

<script>
    fetch('http://localhost:5000/api/admin/settings')
        .then(r => r.json())
        .then(d => {
            if(d.success && d.data){
                var s = d.data;
                document.getElementById('cPhone').textContent = s.ownerWhatsApp || '-';
                document.getElementById('cEmail').textContent = s.ownerEmail || '-';
                document.getElementById('cAddress').textContent = s.address || '-';
                document.getElementById('cHours').textContent = s.workingHours || '-';
            }
        });
    
    function sendMessage(e){
        e.preventDefault();
        alert('Message sent! We will contact you soon.');
        e.target.reset();
    }
</script>

</body>
</html>
